<!doctype html>
<html lang="en">
  <head>
    <script>
      const fanPath = window.location.pathname;
      const appStartUrl = /^\/live\/[^/]+\/?$/.test(fanPath) ? fanPath : '/';
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = `/api/manifest?start_url=${encodeURIComponent(appStartUrl)}`;
      document.head.append(manifestLink);
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2e16" />
    <title>LaxLive - Live Lacrosse Stats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
