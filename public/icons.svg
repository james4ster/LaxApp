<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth background gradient for depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5631" />
      <stop offset="100%" stop-color="#143B21" />
    </linearGradient>
  </defs>

  <!-- Rounded Base Card Context -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- STATS TRACKING ELEMENT: Upward Trend Arrow -->
  <path d="M260 280 L315 225 L370 270 L440 160 M440 160 L390 160 M440 160 L440 210"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.85" />

  <!-- LACROSSE ELEMENT: Simplified Cross Stick & Head -->
  <g transform="translate(40, -10)">
    <!-- Shaft / Handle -->
    <line x1="160" y1="360" x2="320" y2="200" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />
    <line x1="160" y1="360" x2="320" y2="200" stroke="#1E5631" stroke-width="8" stroke-linecap="round" />

    <!-- Outer Head Outline -->
    <path d="M280 240 C240 200 210 160 190 110 C180 85 195 60 220 50 C250 40 290 55 330 95 C370 135 385 175 375 205 C365 230 340 245 315 235 C295 225 290 230 280 240 Z"
          fill="#FFFFFF" />

    <!-- Interior Pocket Cutout (Creates the mask effect) -->
    <path d="M280 220 C252 192 228 156 212 116 C206 101 214 87 228 82 C247 75 273 86 302 115 C331 144 342 170 335 189 C330 203 316 211 301 205 C288 200 285 204 280 220 Z"
          fill="#1E5631" />

    <!-- Bold, High-Visibility Grid Mesh (Won't turn to mush at 16x16) -->
    <path d="M230 145 L315 145 M248 115 L288 115 M230 145 L255 75 M265 160 L290 90 M298 185 L320 120"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="8"
          stroke-linecap="round" />

    <!-- The Lacrosse Ball -->
    <circle cx="275" cy="145" r="22" fill="#FFFFFF" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.2))" />
  </g>
</svg>
